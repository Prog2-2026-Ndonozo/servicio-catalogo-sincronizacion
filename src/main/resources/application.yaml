spring:
  application:
    name: servicio-catalogo-sincronizacion

  config:
    import: optional:file:.env[.properties]   # carga el .env local; una variable de entorno real tiene prioridad

  datasource:
    url : jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:catalogo}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate          
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
      show_sql: false
catedra:
  base-url: ${CATEDRA_BASE_URL}
  jwt: ${CATEDRA_JWT}


